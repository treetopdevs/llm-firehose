# CLI release: builds firehose + firehosed for macOS/Linux and attaches
# archives to the GitHub Release. The Homebrew formula (firehose, with a
# `brew services` definition) and the desktop cask (agent-firehose) are
# rendered by scripts/render-tap.sh in the same workflow
# (.github/workflows/release.yml); GoReleaser's own brew publishers don't
# fit (casks have no service stanza, `brews` is deprecated).
# Triggered by pushing a v* tag.
version: 2

project_name: firehose

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: firehose
    main: ./cmd/firehose
    binary: firehose
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: firehosed
    main: ./cmd/firehosed
    binary: firehosed
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - id: default
    ids: [firehose, firehosed]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "Merge "]
